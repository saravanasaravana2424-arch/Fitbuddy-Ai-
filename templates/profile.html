
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FitBuddy User Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e4f8e8;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #218838;
            text-align: center;
        }

        .info {
            padding: 12px;
            margin: 10px 0;
            background: #f4f7f5;
            border-radius: 7px;
        }

        .plan {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>FitBuddy User Profile 💪</h1>

    <div class="info">
        <strong>User ID:</strong> {{ user.id }}
    </div>

    <div class="info">
        <strong>Name:</strong> {{ user.name }}
    </div>

    <div class="info">
        <strong>Age:</strong> {{ user.age }}
    </div>

    <div class="info">
        <strong>Fitness Level:</strong> {{ user.fitness_level }}
    </div>

    <div class="info">
        <strong>Fitness Goal:</strong> {{ user.goal }}
    </div>

    <div class="info">
        <strong>Feedback:</strong> {{ user.feedback or "No Feedback" }}
    </div>

    <h2>Fitness Plan</h2>

    <div class="plan">{{ user.fitness_plan }}</div>

    <a href="/all-users">Back to Admin Panel</a>

</div>

</body>
</html>
